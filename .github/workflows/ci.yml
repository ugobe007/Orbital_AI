name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CSS build + Pytest + site smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ORBITAL_SIMULATOR_ENABLED: "0"
      ORBITAL_ORCHESTRATOR_ENABLED: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q --tb=short

      - name: Marketing site smoke
        run: python scripts/smoke_site.py
